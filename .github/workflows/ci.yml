name: Elixir CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise & Runtime
        # 使用 jdx/mise-action 替代 mise-en-place/action
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          # 建议在 key 中加入 mise.toml，确保环境变更时缓存能正确失效
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/mise.toml') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get --only test --no-archives-check

      - name: Run tests
        run: mix test